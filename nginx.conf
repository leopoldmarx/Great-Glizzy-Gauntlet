server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Allow SEO files (must be before the blocking rule)
    location = /robots.txt {
        allow all;
    }

    location = /sitemap.xml {
        allow all;
    }

    # Admin files are not served publicly — open locally instead
    location ~* ^/(admin|admin-config)(\.html?)?$ {
        deny all;
        return 404;
    }

    # Block access to sensitive file types
    location ~* \.(docx?|xlsx?|pptx?|csv|gsheet|env|log|bak|sql|conf|ini|sh|py|php|asp|jsp|cgi|txt|md|json|yml|yaml|xml|lock|toml|gitignore|dockerignore|tar|gz|zip|rar|7z)$ {
        deny all;
        return 404;
    }


    # Block access to backup files and temp files
    location ~* \.(bak|backup|swp|swo|tmp|temp|old|orig|~)$ {
        deny all;
        return 404;
    }

    # Block access to __pycache__ and other cache directories
    location ~ /(__|node_modules|\.git|\.vscode|\.idea)/ {
        deny all;
        return 404;
    }

    # Block access to hidden files (starting with .)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Serve static files with proper MIME types
    # Try: exact file, then with .html extension, then directory, then 404
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Image file types
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        types {
            image/jpeg jpg jpeg;
            image/png png;
            image/gif gif;
            image/svg+xml svg;
            image/webp webp;
            image/avif avif;
        }
    }

    # CSS and JS files
    location ~* \.(css|js)$ {
        etag on;
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        add_header Vary "Accept-Encoding";
        add_header X-Content-Type-Options "nosniff";
    }
}