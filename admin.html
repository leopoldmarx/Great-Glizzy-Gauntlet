<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Great Glizzy Gauntlet</title>

    <!-- SEO - noindex for admin page -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Admin panel for Great Glizzy Gauntlet submission review">

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔐</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        /* Admin page specific overrides */
        body {
            background: #1a1a2e;
            min-height: 100vh;
        }

        .container { max-width: 1400px; margin: 0 auto; padding: 2rem; }

        /* Admin-specific button styling */
        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* Admin loading with white text */
        .loading { color: white; display: block; }

        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
        }

        /* Route analysis map section — dark panel so text stays white on the light .card */
        .route-analysis {
            margin-top: 1.5rem;
            padding: 1.25rem;
            border-radius: 8px;
            background: #1e2d45;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .route-analysis h4 {
            color: #e0e7ff;
            margin-bottom: 0.75rem;
            font-size: 1rem;
        }

        .segment-nav {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.5rem;
        }

        .segment-nav .seg-btn {
            background: #2d4268;
            color: #e0e7ff;
            border: 1px solid #4a6090;
            padding: 0.45rem 1.1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            font-family: inherit;
            transition: background 0.2s;
            display: inline-block;
        }

        .segment-nav .seg-btn:hover:not(:disabled) {
            background: #3a5580;
        }

        .segment-nav .seg-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .segment-label {
            flex: 1;
            text-align: center;
            color: white;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .segment-counter {
            color: rgba(255,255,255,0.5);
            font-size: 0.8rem;
            min-width: 40px;
            text-align: right;
        }

        .similarity-display {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            min-height: 1.5rem;
        }

        .sim-badge {
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-weight: 600;
            white-space: nowrap;
        }

        .sim-excellent { background: #16a34a; color: white; }
        .sim-good      { background: #ca8a04; color: white; }
        .sim-fair      { background: #ea580c; color: white; }
        .sim-poor      { background: #dc2626; color: white; }

        .sim-detail {
            color: rgba(255,255,255,0.65);
        }

        .map-container {
            height: 360px;
            border-radius: 8px;
            overflow: hidden;
            background: #1a2535;
            padding: 0; /* override styles.css .map-container padding */
            box-shadow: none;
            margin-bottom: 0;
        }

        /* ── Ride Metrics ─────────────────────────────── */
        .ride-metrics {
            margin-top: 1.5rem;
            padding: 1.25rem;
            border-radius: 8px;
            background: #141f2e;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .ride-metrics h4 { color: #e0e7ff; margin-bottom: 0.75rem; font-size: 1rem; }

        .metrics-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
            margin-bottom: 0.5rem;
        }
        .metrics-table th {
            color: rgba(255,255,255,0.38);
            font-size: 0.71rem;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            padding: 0.3rem 0.6rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            text-align: left;
        }
        .metrics-table td { padding: 0.35rem 0.6rem; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .metrics-table tr:last-child td { border-bottom: none; }
        .metrics-table .section-head td {
            padding-top: 0.75rem;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: rgba(255,255,255,0.35);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        /* Speed colour bands */
        .spd-normal  { color: #4ade80; }   /* <17 mph  — normal  */
        .spd-fast    { color: #facc15; }   /* 17–21    — fast    */
        .spd-flagged { color: #fb923c; }   /* 21–25    — flag    */
        .spd-sus     { color: #f87171; }   /* >25      — suspicious */

        /* Dwell colour bands */
        .dwell-fine  { color: rgba(255,255,255,0.6); }
        .dwell-quick { color: #facc15; }
        .dwell-sus   { color: #f87171; }

        .metrics-pills {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            margin-top: 0.75rem;
        }
        .m-pill {
            background: rgba(255,255,255,0.06);
            border-radius: 5px;
            padding: 0.28rem 0.7rem;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.55);
        }
        .m-pill strong { color: white; }
        .m-pill-warn {
            background: rgba(251,146,60,0.12);
            border: 1px solid rgba(251,146,60,0.3);
            color: #fb923c;
        }

        .map-no-track {
            height: 360px;
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.4);
            font-size: 0.9rem;
            font-style: italic;
        }
    </style>
    
    <!-- Load password hash from external config file (add admin-config.js to .gitignore!) -->
    <script src="admin-config.js"></script>
</head>
<body>
    <!-- Login Screen -->
    <div class="login-screen" id="loginScreen">
        <div class="login-card">
            <h1>🔐 Admin Access</h1>
            <p>Great Glizzy Gauntlet Submission Review</p>
            <input type="password" id="passwordInput" placeholder="Enter admin password" autofocus>
            <button class="btn btn-approve" style="width: 100%;" onclick="attemptLogin()">
                Login
            </button>
            <p id="loginError" style="color: var(--danger-color); margin-top: 1rem; display: none;">
                Invalid password
            </p>
        </div>
    </div>

    <!-- Admin Panel -->
    <div class="admin-panel" id="adminPanel">
        <div class="admin-header">
            <h1>🌭 GGG Admin Panel</h1>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
        
        <div class="container">
            <!-- Tabs -->
            <div class="tabs">
                <button class="tab-btn active" data-tab="pending" onclick="switchTab('pending')">
                    ⏳ Pending Review <span class="tab-count" id="pendingCount">0</span>
                </button>
                <button class="tab-btn" data-tab="approved" onclick="switchTab('approved')">
                    ✅ Approved
                </button>
                <button class="tab-btn" data-tab="rejected" onclick="switchTab('rejected')">
                    ❌ Rejected
                </button>
                <button class="tab-btn" data-tab="all" onclick="switchTab('all')">
                    📋 All Submissions
                </button>
            </div>
            
            <!-- Publish Results Panel -->
            <div id="publishPanel" style="
                background: rgba(255,255,255,0.05);
                border: 1px solid rgba(255,255,255,0.12);
                border-radius: 10px;
                padding: 1rem 1.25rem;
                margin-bottom: 1.25rem;
                display: flex;
                align-items: center;
                gap: 1rem;
                flex-wrap: wrap;
            ">
                <div style="flex:1;min-width:200px;">
                    <div style="font-weight:600;color:rgba(255,255,255,0.9);font-size:0.95rem;">📢 Publish Results</div>
                    <div style="font-size:0.78rem;color:rgba(255,255,255,0.45);margin-top:0.2rem;" id="publishStatus">
                        Download <code>results-YEAR.json</code> and place it in the server root to reveal the leaderboard.
                    </div>
                </div>
                <div style="display:flex;gap:0.6rem;align-items:center;flex-wrap:wrap;">
                    <select id="publishYear" style="
                        background:rgba(255,255,255,0.08);
                        border:1px solid rgba(255,255,255,0.2);
                        border-radius:6px;
                        color:rgba(255,255,255,0.85);
                        padding:0.35rem 0.6rem;
                        font-size:0.85rem;
                        font-family:inherit;
                    ">
                        <option value="2026">2026</option>
                    </select>
                    <button onclick="publishResults()" style="
                        background: #22c55e;
                        color: white;
                        border: none;
                        border-radius: 7px;
                        padding: 0.4rem 1rem;
                        font-weight: 700;
                        font-size: 0.85rem;
                        cursor: pointer;
                        font-family: inherit;
                        white-space: nowrap;
                    ">⬇️ Download JSON</button>
                </div>
            </div>

            <!-- Loading -->
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Loading submissions...</p>
            </div>

            <!-- Submissions Container -->
            <div id="submissionsContainer"></div>
        </div>
    </div>

    <script>
        // =====================================================
        // CONFIGURATION
        // =====================================================
        
        // Google Apps Script Web App URL
        const API_URL = 'https://script.google.com/macros/s/AKfycbwuMP8IkLM5bE8vGzXUyKo_n0VLn-ZOvGNGOf32HLeZ2vx5i5uXgizPw4JqSeio_Hjp/exec';
        
        // State
        let submissions = [];
        let currentTab = 'pending';
        let isLoggedIn = false;
        
        // Costco names
        const COSTCO_NAMES = [
            'Orem', 'Lehi', 'Saratoga Springs', 'Riverton', 'South Jordan',
            'Sandy', 'Murray', 'West Valley', 'Salt Lake City', 'Bountiful'
        ];

        // Costco lat/lon for route segment mapping
        const COSTCO_LOCATIONS = [
            { name: 'Orem',             lat: 40.28056298936492,  lon: -111.67989096390991 },
            { name: 'Lehi',             lat: 40.38930244722512,  lon: -111.82281926596582 },
            { name: 'Saratoga Springs', lat: 40.3813625264605,   lon: -111.91846628756342 },
            { name: 'Riverton',         lat: 40.51326031602138,  lon: -112.00193679057458 },
            { name: 'South Jordan',     lat: 40.56004657032966,  lon: -111.97541047830654 },
            { name: 'Sandy',            lat: 40.549869250400754, lon: -111.8943388234441  },
            { name: 'Murray',           lat: 40.65774477283043,  lon: -111.88997616091126 },
            { name: 'West Valley',      lat: 40.690548404589144, lon: -111.95432454852087 },
            { name: 'Salt Lake City',   lat: 40.73088295779431,  lon: -111.90172671952065 },
            { name: 'Bountiful',        lat: 40.89003698423399,  lon: -111.894651184651   }
        ];

        // Costco-to-Costco segments (9 legs)
        const SEGMENTS = [
            { label: 'Orem → Lehi',                 fromIdx: 0, toIdx: 1 },
            { label: 'Lehi → Saratoga Springs',      fromIdx: 1, toIdx: 2 },
            { label: 'Saratoga Springs → Riverton',  fromIdx: 2, toIdx: 3 },
            { label: 'Riverton → South Jordan',      fromIdx: 3, toIdx: 4 },
            { label: 'South Jordan → Sandy',         fromIdx: 4, toIdx: 5 },
            { label: 'Sandy → Murray',               fromIdx: 5, toIdx: 6 },
            { label: 'Murray → West Valley',         fromIdx: 6, toIdx: 7 },
            { label: 'West Valley → Salt Lake City', fromIdx: 7, toIdx: 8 },
            { label: 'Salt Lake City → Bountiful',   fromIdx: 8, toIdx: 9 },
        ];

        // Mile markers matching COSTCO_LOCATIONS order
        const COSTCO_MILES = [3.1, 20.8, 26.3, 42.2, 46.6, 51.7, 64.3, 70.6, 78.8, 99.3];

        // Route analysis state
        let officialRoute = [];         // [{lat, lon}] parsed from official GPX
        let officialCostcoIdx = [];     // index into officialRoute nearest each Costco
        let mapInstances = {};          // { subId: L.Map }
        let segmentState = {};          // { subId: { index, riderTrack, verification } }
        let lastFilteredSubs = [];
        
        // =====================================================
        // AUTHENTICATION
        // =====================================================
        
        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            // Check if config loaded
            if (typeof GGG_ADMIN_CONFIG === 'undefined') {
                console.error('admin-config.js not found! Create it with your password hash.');
            }
            
            if (sessionStorage.getItem('ggg_admin_auth') === 'true') {
                showAdminPanel();
            }
            
            document.getElementById('passwordInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') attemptLogin();
            });
        });
        
        async function attemptLogin() {
            const password = document.getElementById('passwordInput').value;
            const passwordHash = await hashPassword(password);
            
            // Get hash from config file
            const expectedHash = (typeof GGG_ADMIN_CONFIG !== 'undefined') 
                ? GGG_ADMIN_CONFIG.passwordHash 
                : null;
            
            if (expectedHash && passwordHash === expectedHash) {
                sessionStorage.setItem('ggg_admin_auth', 'true');
                showAdminPanel();
            } else {
                document.getElementById('loginError').style.display = 'block';
                document.getElementById('passwordInput').value = '';
            }
        }
        
        function logout() {
            sessionStorage.removeItem('ggg_admin_auth');
            location.reload();
        }
        
        function showAdminPanel() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('adminPanel').classList.add('show');
            // Load official route first, then submissions (route is local/fast)
            loadOfficialRoute();
            loadSubmissions();
        }
        
        // =====================================================
        // DATA LOADING
        // =====================================================
        
        async function loadSubmissions() {
            const loading = document.getElementById('loading');
            loading.style.display = 'block';
            document.getElementById('submissionsContainer').innerHTML = '';

            try {
                // Get admin token from config
                const adminToken = (typeof GGG_ADMIN_CONFIG !== 'undefined')
                    ? GGG_ADMIN_CONFIG.adminToken
                    : '';

                const response = await fetch(`${API_URL}?action=getSubmissions&adminToken=${encodeURIComponent(adminToken)}`);
                const result = await response.json();

                if (result.error) {
                    console.error('API Error:', result.error);
                    if (result.error === 'Unauthorized') {
                        alert('Invalid admin token. Please check your admin-config.js and Google Apps Script properties.');
                        logout();
                        return;
                    }
                    submissions = getSampleSubmissions();
                } else {
                    submissions = result;
                }
            } catch (err) {
                console.log('Using sample data (API not configured)');
                submissions = getSampleSubmissions();
            }

            loading.style.display = 'none';
            updatePendingCount();
            renderSubmissions();
        }
        
        function getSampleSubmissions() {
            return [
                {
                    id: 1,
                    name: 'Test Rider',
                    email: 'test@example.com',
                    rideDate: '2026-05-02',
                    elapsedTime: '26100000',  // 7:15:00 in milliseconds
                    avgSpeed: '13.2 mph',
                    stravaLink: 'https://strava.com/activities/123',
                    bonuses: ['hotdog_purist', 'spanish_fork'],
                    comments: 'Great ride!',
                    costcosVisited: 10,
                    gpxHash: 'abc123def456',
                    totalDistance: '98.5',
                    verificationData: JSON.stringify({
                        'Orem': { visited: true },
                        'Lehi': { visited: true },
                        'Saratoga Springs': { visited: true },
                        'Riverton': { visited: true },
                        'South Jordan': { visited: true },
                        'Sandy': { visited: true },
                        'Murray': { visited: true },
                        'West Valley': { visited: true },
                        'Salt Lake City': { visited: true },
                        'Bountiful': { visited: true },
                        'Spanish Fork': { visited: true }
                    }),
                    submittedAt: '2026-05-02T20:30:00Z',
                    status: 'pending',
                    year: 2026
                }
            ];
        }
        
        function updatePendingCount() {
            const pending = submissions.filter(s => s.status === 'pending').length;
            document.getElementById('pendingCount').textContent = pending;
        }
        
        // =====================================================
        // RENDERING
        // =====================================================
        
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === tab);
            });
            renderSubmissions();
        }
        
        function renderSubmissions() {
            destroyAllMaps();

            const container = document.getElementById('submissionsContainer');

            let filtered = submissions;
            if (currentTab !== 'all') {
                filtered = submissions.filter(s => s.status === currentTab);
            }

            lastFilteredSubs = filtered;

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="card">
                        <div class="empty-state">
                            <div class="icon">${currentTab === 'pending' ? '✨' : '📭'}</div>
                            <h3>No ${currentTab} submissions</h3>
                            <p>${currentTab === 'pending' ? 'All caught up!' : 'Nothing here yet.'}</p>
                        </div>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(sub => renderSubmissionCard(sub)).join('');
            initMaps(filtered);
        }
        
        // Submission deadline: Mon May 4, 2026 11:59 PM MDT (= May 5, 2026 05:59 UTC)
        const SUBMISSION_DEADLINE = new Date('2026-05-05T05:59:00Z');

        function renderSubmissionCard(sub) {
            const statusClass = `status-${sub.status}`;
            const statusText = sub.status.charAt(0).toUpperCase() + sub.status.slice(1);

            // Check for duplicate hash (only flags when another approved ride shares this hash)
            const duplicates = submissions.filter(s =>
                s.gpxHash === sub.gpxHash &&
                s.id !== sub.id &&
                s.status === 'approved'
            );
            const hasDuplicate = duplicates.length > 0;

            // Check submission deadline
            const submittedAt = new Date(sub.submittedAt);
            const isLate = !isNaN(submittedAt) && submittedAt > SUBMISSION_DEADLINE;

            // Parse verification data; also check for low dwell times
            let verificationHtml = '';
            let lowDwellCostcos = [];
            try {
                const verification = JSON.parse(sub.verificationData || '{}');
                verificationHtml = COSTCO_NAMES.map(name => {
                    const visited = verification[name]?.visited;
                    return `<span class="costco-mini ${visited ? 'visited' : 'missed'}">${visited ? '✓' : '✗'} ${name}</span>`;
                }).join('');

                if (verification['Spanish Fork']) {
                    const sfVisited = verification['Spanish Fork'].visited;
                    verificationHtml += `<span class="costco-mini ${sfVisited ? 'visited' : 'missed'}">${sfVisited ? '⭐' : '✗'} Spanish Fork</span>`;
                }

                // Detect low dwell times from verificationData timestamps
                COSTCO_NAMES.forEach(name => {
                    const vd = verification[name];
                    if (!vd?.visited || !vd.visitTime || !vd.departureTime) return;
                    const arrival = new Date(vd.visitTime);
                    const departure = new Date(vd.departureTime);
                    if (!isNaN(arrival) && !isNaN(departure) && departure > arrival) {
                        const dwellMin = (departure - arrival) / 60000;
                        if (dwellMin < 5) lowDwellCostcos.push({ name, min: Math.round(dwellMin) });
                    }
                });
            } catch (e) {
                verificationHtml = '<p>Verification data not available</p>';
            }

            // Bonuses
            const bonusLabels = {
                'hotdog_purist': '🌭 Hot Dog Purist',
                'pizza_party': '🍕 Pizza Party',
                'menu_master': '🎭 Menu Master',
                'sample_collector': '🧪 Sample Collector',
                'speed_demon': '⚡ Speed Demon',
                'spanish_fork': '🏔️ Spanish Fork'
            };
            const bonuses = (sub.bonuses || []).map(b => bonusLabels[b] || b).join(', ') || 'None';

            // Load saved admin note for this submission
            const savedNote = localStorage.getItem(`ggg_admin_note_${sub.id}`) || '';

            return `
                <div class="card" id="submission-${sub.id}">
                    ${hasDuplicate ? `
                        <div class="hash-warning">
                            <strong>⚠️ Possible Duplicate:</strong> This GPX hash matches an already approved submission.
                        </div>
                    ` : ''}
                    ${isLate ? `
                        <div class="hash-warning" style="border-left-color: #f87171; background: #fee2e2;">
                            <strong style="color: #991b1b;">⏰ Late Submission:</strong> <span style="color: #7f1d1d;">Submitted after the Mon May 4 11:59 PM deadline (${submittedAt.toLocaleString()}).</span>
                        </div>
                    ` : ''}
                    ${lowDwellCostcos.length > 0 ? `
                        <div class="hash-warning" style="border-left-color: #fb923c; background: #fff7ed;">
                            <strong style="color: #9a3412;">⚠️ Low Dwell Time:</strong> <span style="color: #7c2d12;">${lowDwellCostcos.map(d => `${d.name} (${d.min} min)`).join(', ')} — verify food was purchased.</span>
                        </div>
                    ` : ''}

                    <div class="card-header">
                        <div>
                            <div class="card-title">${escapeHtml(sub.name)}</div>
                            <div class="card-meta">
                                Submitted: ${submittedAt.toLocaleString()}
                                ${isLate ? ' <span style="color:#f87171;font-weight:600;">⏰ LATE</span>' : ' <span style="color:#4ade80;">✓ on time</span>'}
                            </div>
                        </div>
                        <span class="status-badge ${statusClass}">${statusText}</span>
                    </div>

                    <div class="info-grid">
                        <div class="info-item">
                            <label>Email</label>
                            <div class="value">${escapeHtml(sub.email)}</div>
                        </div>
                        <div class="info-item">
                            <label>Ride Date</label>
                            <div class="value">${sub.rideDate}</div>
                        </div>
                        <div class="info-item">
                            <label>Challenge Time</label>
                            <div class="value">${formatElapsedTime(sub.elapsedTime)}</div>
                        </div>
                        <div class="info-item">
                            <label>Avg Speed</label>
                            <div class="value">${sub.avgSpeed || '-'}</div>
                        </div>
                        <div class="info-item">
                            <label>Costcos Visited</label>
                            <div class="value" style="color: ${sub.costcosVisited >= 10 ? 'var(--success-color)' : 'var(--primary-color)'}">
                                ${sub.costcosVisited}/10
                            </div>
                        </div>
                        <div class="info-item">
                            <label>Total Distance</label>
                            <div class="value">${sub.totalDistance ? sub.totalDistance + ' mi' : '-'}</div>
                        </div>
                        <div class="info-item">
                            <label>Strava Link</label>
                            <div class="value">

        function saveAdminNote(id) {
            const textarea = document.getElementById(`note-${id}`);
            if (textarea) {
                localStorage.setItem(`ggg_admin_note_${id}`, textarea.value);
            }
        }

        // =====================================================
        // PUBLISH RESULTS
        // =====================================================

        function publishResults() {
            const year = parseInt(document.getElementById('publishYear').value);
            const statusEl = document.getElementById('publishStatus');

            // Only include approved submissions for the selected year
            const approved = submissions.filter(s =>
                s.status === 'approved' && (parseInt(s.year) === year || !s.year)
            );

            if (approved.length === 0) {
                statusEl.textContent = `⚠️ No approved submissions found for ${year}.`;
                return;
            }

            // Build the public-safe result objects (strip internal fields)
            const PUBLIC_FIELDS = [
                'name', 'rideDate', 'elapsedTime', 'avgSpeed', 'totalDistance',
                'movingTime', 'stravaLink', 'bonuses', 'foodOrders',
                'costcosVisited', 'ebikeUsed'
            ];

            const results = approved.map(s => {
                const out = {};
                PUBLIC_FIELDS.forEach(f => { if (s[f] !== undefined) out[f] = s[f]; });
                return out;
            });

            const payload = {
                year,
                published: true,
                publishedAt: new Date().toISOString(),
                results
            };

            // Trigger browser download
            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
            const url  = URL.createObjectURL(blob);
            const a    = document.createElement('a');
            a.href     = url;
            a.download = `results-${year}.json`;
            a.click();
            URL.revokeObjectURL(url);

            statusEl.innerHTML = `✅ Downloaded <strong>results-${year}.json</strong> with ${results.length} rider${results.length !== 1 ? 's' : ''}. `
                + `Deploy with: <code style="font-size:0.75rem;">docker cp results-${year}.json &lt;container&gt;:/usr/share/nginx/html/</code>`;
        }
        
        // =====================================================
        // ACTIONS
        // =====================================================

        function rejectWithReason(id) {
            const reason = prompt('Rejection reason (included in email to rider — leave blank to skip):');
            if (reason === null) return; // cancelled
            updateStatus(id, 'rejected', reason.trim());
        }

        async function updateStatus(id, newStatus, rejectionReason = '') {
            const card = document.getElementById(`submission-${id}`);
            const buttons = card.querySelectorAll('.btn');
            buttons.forEach(btn => btn.disabled = true);

            try {
                // Get admin token from config
                const adminToken = (typeof GGG_ADMIN_CONFIG !== 'undefined')
                    ? GGG_ADMIN_CONFIG.adminToken
                    : '';

                await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'updateStatus',
                        id: id,
                        status: newStatus,
                        adminToken: adminToken,
                        ...(rejectionReason ? { rejectionReason } : {})
                    })
                });

                const submission = submissions.find(s => s.id === id);
                if (submission) {
                    submission.status = newStatus;
                }

                updatePendingCount();
                renderSubmissions();

            } catch (err) {
                alert('Error updating status. Please try again.');
                buttons.forEach(btn => btn.disabled = false);
            }
        }
        
        // =====================================================
        // UTILITIES
        // =====================================================

        function formatElapsedTime(value) {
            if (!value || value === '-') return '-';

            // Handle milliseconds (new format)
            const ms = parseInt(value);
            if (!isNaN(ms) && ms > 1000000) {
                // Likely milliseconds (>16 minutes)
                const hours = Math.floor(ms / (1000 * 60 * 60));
                const minutes = Math.floor((ms % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((ms % (1000 * 60)) / 1000);
                return `${hours}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }

            // Handle legacy H:MM format - convert to H:MM:SS
            if (typeof value === 'string' && value.includes(':')) {
                const parts = value.split(':');
                if (parts.length === 2) {
                    return `${parts[0]}:${parts[1].padStart(2, '0')}:00`;
                }
                return value;
            }

            return '-';
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function haversineDistance(lat1, lon1, lat2, lon2) {
            const R = 3959;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) ** 2 +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function loadOfficialRoute() {
            // Use embedded route data — works from file:// without any server
            officialRoute = OFFICIAL_ROUTE_EMBEDDED.map(p => ({ lat: p[0], lon: p[1] }));
            officialCostcoIdx = COSTCO_LOCATIONS.map(c => findNearestOfficialIdx(c.lat, c.lon));
            console.log(`Official route loaded: ${officialRoute.length} points (embedded)`);
        }

        function findNearestOfficialIdx(lat, lon) {
            let minD = Infinity, idx = 0;
            for (let i = 0; i < officialRoute.length; i++) {
                const d = haversineDistance(officialRoute[i].lat, officialRoute[i].lon, lat, lon);
                if (d < minD) { minD = d; idx = i; }
            }
            return idx;
        }

        function getOfficialSegment(segIdx) {
            if (officialRoute.length === 0 || officialCostcoIdx.length < 10) return [];
            const s = SEGMENTS[segIdx];
            const a = officialCostcoIdx[s.fromIdx];
            const b = officialCostcoIdx[s.toIdx];
            return officialRoute.slice(Math.min(a, b), Math.max(a, b) + 1);
        }

        // Ordered forward-search: each Costco's nearest track index must be >= the previous one.
        // Prevents the "global nearest" bug where unvisited Costcos steal indices from later ones.
        function getRiderCostcoIndices(track) {
            let searchFrom = 0;
            return COSTCO_LOCATIONS.map(costco => {
                let minD = Infinity, bestI = searchFrom;
                for (let i = searchFrom; i < track.length; i++) {
                    const d = haversineDistance(track[i][0], track[i][1], costco.lat, costco.lon);
                    if (d < minD) { minD = d; bestI = i; }
                }
                searchFrom = Math.min(bestI + 1, track.length - 1);
                return bestI;
            });
        }

        function getRiderSegment(track, segIdx, riderCostcoIndices) {
            if (!riderCostcoIndices) return [];
            const s  = SEGMENTS[segIdx];
            const a  = riderCostcoIndices[s.fromIdx];
            const b  = riderCostcoIndices[s.toIdx];
            if (a === undefined || b === undefined || a >= b) return [];
            return track.slice(a, b + 1);
        }

        // Bidirectional (symmetric) distance:
        //   official→rider  — catches segments the rider skipped entirely
        //   rider→official  — catches segments where the rider deviated from the route
        // Uses fast squared-degree approximation (cosLat correction) to avoid per-call trig.
        function calcSimilarityScore(riderPts, officialPts) {
            if (!riderPts.length || !officialPts.length) return null;
            const cosLat = Math.cos(40.5 * Math.PI / 180); // Utah Valley centre

            // Official → Rider
            let sumO2R = 0;
            for (const op of officialPts) {
                let minSq = Infinity;
                for (const rp of riderPts) {
                    const dlat = op.lat  - rp[0];
                    const dlon = (op.lon - rp[1]) * cosLat;
                    const sq   = dlat * dlat + dlon * dlon;
                    if (sq < minSq) minSq = sq;
                }
                sumO2R += Math.sqrt(minSq);
            }

            // Rider → Official
            let sumR2O = 0;
            for (const rp of riderPts) {
                let minSq = Infinity;
                for (const op of officialPts) {
                    const dlat = rp[0]  - op.lat;
                    const dlon = (rp[1] - op.lon) * cosLat;
                    const sq   = dlat * dlat + dlon * dlon;
                    if (sq < minSq) minSq = sq;
                }
                sumR2O += Math.sqrt(minSq);
            }

            // 1° lat ≈ 364,320 ft; average both directions
            return ((sumO2R / officialPts.length) + (sumR2O / riderPts.length)) / 2 * 364320;
        }

        // =====================================================
        // RIDE METRICS
        // =====================================================

        // Calculate moving speed over a slice of the track.
        // Filters out intervals where the rider was stationary (< MIN_MPH).
        // Returns mph, or null if timestamps are missing / data is thin.
        function calcSegmentMovingSpeed(track, fromIdx, toIdx, distanceMiles) {
            if (!track || fromIdx >= toIdx) return null;

            const MIN_MPH    = 2;       // below this = stopped / coasting to a stop
            const MAX_GAP_MS = 120000;  // ignore gaps > 2 min (GPS paused / tunnel)

            const seg = track.slice(fromIdx, toIdx + 1);
            if (seg.length < 2 || seg[0].length < 3) return null; // no timestamps

            let movingMs = 0;
            for (let i = 1; i < seg.length; i++) {
                const t0 = seg[i - 1][2], t1 = seg[i][2];
                if (t0 === null || t1 === null) return null;  // any null → no data
                const dt = t1 - t0;
                if (dt <= 0 || dt > MAX_GAP_MS) continue;

                const d     = haversineDistance(seg[i-1][0], seg[i-1][1], seg[i][0], seg[i][1]);
                const speed = d / (dt / 3600000);
                if (speed >= MIN_MPH) movingMs += dt;
            }

            if (movingMs < 30000) return null;  // < 30 s of moving data = unreliable
            return distanceMiles / (movingMs / 3600000);
        }

        function speedClass(mph) {
            if (mph <  17) return 'spd-normal';
            if (mph <  21) return 'spd-fast';
            if (mph <  25) return 'spd-flagged';
            return 'spd-sus';
        }

        function renderMetrics(sub) {
            let verification = {}, track = null;
            try {
                verification = JSON.parse(sub.verificationData || '{}');
                track = Array.isArray(verification._track) ? verification._track : null;
            } catch(e) {}

            const trackHasTimes = track && track.length > 0 &&
                                  track[0].length >= 3 && track[0][2] !== null;
            const vdHasTimes    = COSTCO_NAMES.some(n => verification[n]?.visitTime);

            if (!vdHasTimes && !trackHasTimes) {
                return `<div class="ride-metrics">
                    <h4>📊 Ride Metrics</h4>
                    <p style="color:rgba(255,255,255,0.3);font-style:italic;font-size:0.83rem;">
                        No timestamp data in this GPX — cannot calculate per-segment metrics.
                    </p>
                </div>`;
            }

            // Pre-compute rider Costco indices for segment slicing
            const rci = (track && track.length > 0) ? getRiderCostcoIndices(track) : null;

            let rows = '';
            let maxSpeed = 0, flagCount = 0;
            let totalDwellMs = 0, dwellCount = 0;

            for (let i = 0; i < COSTCO_NAMES.length; i++) {
                const name = COSTCO_NAMES[i];
                const vd   = verification[name];
                if (!vd || !vd.visited) continue;

                // ── Stop row ──────────────────────────────────────
                const arrival   = vd.visitTime     ? new Date(vd.visitTime)     : null;
                const departure = vd.departureTime ? new Date(vd.departureTime) : null;
                let dwellMin = null;
                if (arrival && departure && !isNaN(arrival) && !isNaN(departure) && departure > arrival) {
                    dwellMin = (departure - arrival) / 60000;
                    totalDwellMs += departure - arrival;
                    dwellCount++;
                }

                const arrStr  = arrival   && !isNaN(arrival)
                    ? arrival.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) : '—';

                let dwellHtml = '<span style="color:rgba(255,255,255,0.25)">—</span>';
                if (dwellMin !== null) {
                    const m = Math.round(dwellMin);
                    const cls = m < 5 ? 'dwell-sus' : m < 12 ? 'dwell-quick' : 'dwell-fine';
                    const flag = m < 5 ? ' ⚠️' : '';
                    dwellHtml = `<span class="${cls}">${m} min${flag}</span>`;
                }

                rows += `<tr>
                    <td style="color:rgba(255,255,255,0.85);font-weight:600;">📍 ${name}</td>
                    <td style="color:rgba(255,255,255,0.45)">${arrStr}</td>
                    <td>dwell: ${dwellHtml}</td>
                    <td></td><td></td>
                </tr>`;

                // ── Segment row (this stop → next visited stop) ───
                let nextIdx = -1;
                for (let j = i + 1; j < COSTCO_NAMES.length; j++) {
                    if (verification[COSTCO_NAMES[j]]?.visited) { nextIdx = j; break; }
                }
                if (nextIdx === -1) continue;

                const nextName = COSTCO_NAMES[nextIdx];
                const nvd      = verification[nextName];
                const segMiles = COSTCO_MILES[nextIdx] - COSTCO_MILES[i];

                // Moving speed from track timestamps (preferred)
                let movingSpeedHtml = '<span style="color:rgba(255,255,255,0.25)">—</span>';
                let movingSpeed = null;
                if (track && rci) {
                    const a = rci[i], b = rci[nextIdx];
                    if (a !== undefined && b !== undefined && b > a) {
                        movingSpeed = calcSegmentMovingSpeed(track, a, b, segMiles);
                    }
                }

                if (movingSpeed !== null) {
                    const cls = speedClass(movingSpeed);
                    if (movingSpeed > 21) flagCount++;
                    if (movingSpeed > maxSpeed) maxSpeed = movingSpeed;
                    movingSpeedHtml = `<span class="${cls}">${movingSpeed.toFixed(1)} mph</span>`;
                } else if (departure && nvd?.visitTime) {
                    // Fallback: elapsed time (labelled so it's clear)
                    const nextArr = new Date(nvd.visitTime);
                    const elapsedMs = nextArr - departure;
                    if (elapsedMs > 0 && elapsedMs < 14 * 3600000) {
                        const elSpeed = segMiles / (elapsedMs / 3600000);
                        const cls = speedClass(elSpeed);
                        if (elSpeed > 21) flagCount++;
                        if (elSpeed > maxSpeed) maxSpeed = elSpeed;
                        movingSpeedHtml = `<span class="${cls}">${elSpeed.toFixed(1)} mph</span>
                            <span style="font-size:0.7em;color:rgba(255,255,255,0.3)"> elapsed</span>`;
                    }
                }

                // Elapsed segment time (for reference, not used as speed denominator)
                let elapsedStr = '—';
                if (departure && nvd?.visitTime) {
                    const ms = new Date(nvd.visitTime) - departure;
                    if (ms > 0) {
                        const h = Math.floor(ms / 3600000);
                        const m = Math.floor((ms % 3600000) / 60000);
                        elapsedStr = h > 0 ? `${h}h ${m}m` : `${m}m`;
                    }
                }

                // Skipped stops between i and nextIdx?
                const skipped = nextIdx - i - 1;
                const skipNote = skipped > 0
                    ? `<span style="color:rgba(255,255,255,0.3);font-size:0.78em"> (${skipped} skip)</span>`
                    : '';

                rows += `<tr>
                    <td style="color:rgba(255,255,255,0.45);padding-left:1.5rem;">
                        ↓ ${nextName}${skipNote}
                    </td>
                    <td style="color:rgba(255,255,255,0.35)">${segMiles.toFixed(1)} mi</td>
                    <td style="color:rgba(255,255,255,0.4)">${elapsedStr}</td>
                    <td>${movingSpeedHtml}</td>
                    <td></td>
                </tr>`;
            }

            // ── Summary pills ─────────────────────────────────
            const pills = [];
            if (maxSpeed > 0)
                pills.push(`<div class="m-pill">Peak moving speed: <strong class="${speedClass(maxSpeed)}">${maxSpeed.toFixed(1)} mph</strong></div>`);
            if (dwellCount > 0)
                pills.push(`<div class="m-pill">Total stop time: <strong>${Math.round(totalDwellMs / 60000)} min</strong></div>`);
            if (!trackHasTimes && vdHasTimes)
                pills.push(`<div class="m-pill" style="color:rgba(255,255,255,0.3)">⚠ Older submission — speeds are elapsed-time estimates</div>`);
            if (flagCount > 0)
                pills.push(`<div class="m-pill m-pill-warn">⚡ ${flagCount} segment${flagCount > 1 ? 's' : ''} above 21 mph — review recommended</div>`);

            return `<div class="ride-metrics">
                <h4>📊 Ride Metrics</h4>
                <table class="metrics-table">
                    <thead><tr>
                        <th>Stop / Segment</th>
                        <th>Dist</th>
                        <th>Elapsed</th>
                        <th>Moving Speed</th>
                        <th></th>
                    </tr></thead>
                    <tbody>${rows}</tbody>
                </table>
                <div class="metrics-pills">${pills.join('')}</div>
                <p style="font-size:0.7rem;color:rgba(255,255,255,0.2);margin-top:0.6rem;">
                    Moving speed filters intervals ≤2 mph from track. Dwell ⚠️ = under 5 min at stop.
                </p>
            </div>`;
        }

        // =====================================================
        // MAP LIFECYCLE
        // =====================================================

        function destroyAllMaps() {
            Object.values(mapInstances).forEach(m => { try { m.remove(); } catch(e) {} });
            mapInstances = {};
            segmentState = {};
        }

        function initMaps(subs) {
            // requestAnimationFrame ensures DOM elements are painted before Leaflet measures them
            requestAnimationFrame(() => {
                subs.forEach(sub => initMapForSub(sub));
            });
        }

        function initMapForSub(sub) {
            const el = document.getElementById(`map-${sub.id}`);
            if (!el) return;

            let riderTrack = null;
            let riderCostcoIndices = null;
            let verification = {};
            try {
                verification = JSON.parse(sub.verificationData || '{}');
                riderTrack = Array.isArray(verification._track) ? verification._track : null;
            } catch(e) {}

            if (officialRoute.length === 0) {
                el.innerHTML = '<p style="color:rgba(255,255,255,0.4);padding:1rem;font-style:italic;">Official route not loaded.</p>';
                return;
            }

            // Pre-compute which track index corresponds to each Costco (ordered forward search).
            // Done once per submission so segment switching is instant.
            if (riderTrack && riderTrack.length > 0) {
                riderCostcoIndices = getRiderCostcoIndices(riderTrack);
            }

            const map = L.map(el, { attributionControl: false });
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);
            L.control.attribution({ prefix: false }).addTo(map);

            mapInstances[sub.id] = map;
            segmentState[sub.id] = { index: 0, riderTrack, riderCostcoIndices, verification };

            updateMapSegment(sub.id);

            // Leaflet needs a size hint after the map container is fully painted
            setTimeout(() => map.invalidateSize(), 250);
        }

        function updateMapSegment(subId) {
            const map = mapInstances[subId];
            const state = segmentState[subId];
            if (!map || !state) return;

            const seg = SEGMENTS[state.index];

            // Update nav UI
            const labelEl   = document.getElementById(`seg-label-${subId}`);
            const counterEl = document.getElementById(`seg-counter-${subId}`);
            const card      = document.getElementById(`submission-${subId}`);
            if (labelEl)   labelEl.textContent = `Leg ${state.index + 1}: ${seg.label}`;
            if (counterEl) counterEl.textContent = `${state.index + 1} / ${SEGMENTS.length}`;
            if (card) {
                const prev = card.querySelector('.seg-prev');
                const next = card.querySelector('.seg-next');
                if (prev) prev.disabled = state.index === 0;
                if (next) next.disabled = state.index === SEGMENTS.length - 1;
            }

            // Clear non-tile layers
            map.eachLayer(l => { if (!(l instanceof L.TileLayer)) map.removeLayer(l); });

            const officialPts = getOfficialSegment(state.index);

            // Draw official route (blue)
            if (officialPts.length > 0) {
                L.polyline(officialPts.map(p => [p.lat, p.lon]), {
                    color: '#3b82f6', weight: 4, opacity: 0.85
                }).bindTooltip('Official route').addTo(map);
            }

            // Draw rider track (red dashed) and compute similarity
            let similarity = null;
            if (state.riderTrack && state.riderTrack.length > 0) {
                const riderPts = getRiderSegment(state.riderTrack, state.index, state.riderCostcoIndices);
                if (riderPts.length > 1) {
                    L.polyline(riderPts, {
                        color: '#ef4444', weight: 3, opacity: 0.9, dashArray: '6,4'
                    }).bindTooltip('Rider track').addTo(map);
                    similarity = calcSimilarityScore(riderPts, officialPts);
                }
            }

            // Costco markers
            const fromC = COSTCO_LOCATIONS[seg.fromIdx];
            const toC   = COSTCO_LOCATIONS[seg.toIdx];
            L.circleMarker([fromC.lat, fromC.lon], { radius: 9, fillColor: '#16a34a', color: '#fff', weight: 2, fillOpacity: 1 })
             .bindTooltip(`Start: ${fromC.name}`, { permanent: false }).addTo(map);
            L.circleMarker([toC.lat, toC.lon],   { radius: 9, fillColor: '#dc2626', color: '#fff', weight: 2, fillOpacity: 1 })
             .bindTooltip(`End: ${toC.name}`, { permanent: false }).addTo(map);

            // Fit to official segment bounds
            if (officialPts.length > 0) {
                map.fitBounds(L.latLngBounds(officialPts.map(p => [p.lat, p.lon])), { padding: [25, 25] });
            }

            // Similarity score display
            const scoreEl = document.getElementById(`seg-score-${subId}`);
            if (!scoreEl) return;
            if (!state.riderTrack) {
                scoreEl.innerHTML = '<span style="color:rgba(255,255,255,0.4);font-style:italic;">No GPS track available — submitted before track recording was added.</span>';
            } else if (similarity !== null) {
                const ft = Math.round(similarity);
                let cls, label;
                if      (ft <  200) { cls = 'excellent'; label = '✅ On Route';              }
                else if (ft <  500) { cls = 'good';      label = '🟡 Minor Deviation';       }
                else if (ft < 1200) { cls = 'fair';      label = '🟠 Moderate Deviation';    }
                else                { cls = 'poor';      label = '🔴 Significant Deviation'; }
                scoreEl.innerHTML = `
                    <span class="sim-badge sim-${cls}">${label}</span>
                    <span class="sim-detail">Avg deviation: ${ft} ft from official route</span>
                    <span class="sim-detail" style="margin-left:auto;">
                        🔵 Official &nbsp; <span style="color:#ef4444;">- - -</span> Rider
                    </span>
                `;
            } else {
                scoreEl.innerHTML = '<span style="color:rgba(255,255,255,0.4);font-style:italic;">Rider did not visit this segment.</span>';
            }
        }

        function changeSegment(subId, dir) {
            const state = segmentState[subId];
            if (!state) return;
            state.index = Math.max(0, Math.min(SEGMENTS.length - 1, state.index + dir));
            updateMapSegment(subId);
        }
    </script>
</body>
</html>
