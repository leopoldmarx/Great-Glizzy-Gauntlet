services:
  web:
    build: .
    image: costcoride:latest
    container_name: costcoride
    ports:
      - "36969:80"
    restart: unless-stopped
    environment:
      # For local dev, set these or use .env file
      # For Portainer, set these in the stack environment variables
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:-}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
